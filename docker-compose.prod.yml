# Floatly on a server. Fill in .env.production (copy .env.production.example), then:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# See DEPLOY.md for the whole guide.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Room for every API copy's connection pool (DATABASE_POOL_SIZE each), plus backups.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POS_OWNER_PASSWORD: ${POS_OWNER_PASSWORD:?set POS_OWNER_PASSWORD}
      POS_APP_PASSWORD: ${POS_APP_PASSWORD:?set POS_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the pos database and its two roles (first start only)
      - ./docker/postgres/init-prod.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No ports: the database is only reachable from the other containers.

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    # Several API copies share the work (each handles one request at a time per CPU core).
    # Roughly one per CPU core on the server is right.
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pos_app:${POS_APP_PASSWORD}@postgres:5432/pos
      MIGRATION_DATABASE_URL: postgres://pos_owner:${POS_OWNER_PASSWORD}@postgres:5432/pos
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: https://${DOMAIN}
      API_DOCS: ${API_DOCS:-false}
      RATE_LIMIT: ${RATE_LIMIT:-1200}
      PORT: 4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Your domain, e.g. floatly.co.zw. Caddy gets its HTTPS certificate automatically.
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # A copy of the database every night, kept for 14 days, in the "backups" volume.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POS_OWNER_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/floatly-$$(date +%Y-%m-%d_%H%M).sql.gz
          pg_dump -h postgres -U pos_owner -d pos | gzip > "$$f" && echo "Backup written: $$f"
          find /backups -name 'floatly-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
