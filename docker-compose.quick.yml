# Floatly on this computer with a FREE temporary Cloudflare address (no domain,
# no Cloudflare account). The address looks like https://some-words.trycloudflare.com
# and CHANGES every time Floatly restarts. Good for trying it out; for a fixed
# address use your own domain with docker-compose.tunnel.yml. floatly.cmd picks
# this file automatically when TUNNEL_TOKEN is empty.

services:
  caddy:
    environment:
      SITE_ADDRESS: ":80"
    ports: !override
      - "127.0.0.1:${LOCAL_PORT:-8080}:80"

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    depends_on:
      - caddy
    command: tunnel --no-autoupdate --url http://caddy:80
